# SIFTed Scalpel profiles, revision 1. For Scalpel 1.60's header/footer grammar.
# Contiguous byte ranges only; these rules do not parse a file's internal structure.
# Forward matching avoids merging adjacent files at the last footer in the image.
# JPEG may end at an embedded thumbnail's EOI; prefer Foremost for structured JPEGs.
jpg y 20000000 \xff\xd8\xff \xff\xd9
png y 20000000 \x89PNG\x0d\x0a\x1a\x0a \x00\x00\x00\x00IEND\xaeB\x60\x82
gif y 20000000 GIF8 \x00\x3b
# PDF incremental updates may require a custom REVERSE rule and a bounded window.
pdf y 20000000 %PDF- %%EOF\x0a
pdf y 20000000 %PDF- %%EOF\x0d\x0a
# ZIP end-of-central-directory record, including its 18 fixed fields.
# Variable-length archive comments and ZIP64 require structure-aware recovery.
zip y 20000000 PK\x03\x04 PK\x05\x06??????????????????
